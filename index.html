<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dist/output.css">
</head>

<body>
  <header class="py-5">
    <div class="inner-header mx-auto px-5  flex flex-col gap-5 max-w-site 2xl:max-w-site-xl ">
      <div class="hidden justify-between border-b border-line py-2 text-xs text-muted md:flex">
        <div class="flex gap-5">
          <a href="#">English</a>
          <a href="#">Dollar</a>
        </div>
        <div class="flex gap-5">
          <a href="#">Tracking Package</a>
          <a href="#">FAQ</a>
          <a href="#">About Us</a>
          <a href="#">Contact Us</a>
        </div>
      </div>
      <div class="flex items-center gap-8">

        <div class="flex flex-1 items-center gap-8">
          <a href="#">
            <img src="./images/Logo.svg" alt="Ecommerce logo">
          </a>

          <form class="relative max-w-md  hidden flex-1 md:inline " role="search">
            <label for="search" class="sr-only">Search</label>

            <input type="search" id="search" placeholder="Search here"
              class="w-full rounded-full border border-line py-2 pr-10 pl-4 text-sm text-ink placeholder:text-muted focus:border-ink focus:outline-none" />

            <button type="submit" class="absolute inset-y-0 right-0 flex items-center pr-3 text-muted">
              <span class="sr-only">Search</span>
              <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                  d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
              </svg>
            </button>
          </form>

          <ul class="hidden items-center gap-6 text-sm whitespace-nowrap font-medium text-ink lg:flex">
            <li><a href="#">All Category</a></li>
            <li><a href="#">Gift Cards</a></li>
            <li><a href="#">Special Event</a></li>
          </ul>
        </div>

        <div class="flex items-center gap-5">
          <a href="#"><img class="size-6" src="./images/heart_outline.svg" alt="Wishlist"></a>
          <a href="#"><img class="size-6" src="./images/user.svg" alt="Account"></a>
          <a href="#"><img class="size-6" src="./images/8666616_shopping_cart_icon 1.svg" alt="Cart"></a>
        </div>

      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-5">
    <div class="hero-inner px-5 mx-auto max-w-site 2xl:max-w-site-xl">
      <div class="hero-grid grid  grid-cols-1 md:grid-cols-4 grid-rows-2 gap-5  ">
        <div
          class="image-1  flex flex-col items-start p-10 gap-5 min-h-screen rounded-4xl bg-[url('../images/image-1.png')] bg-cover bg-center bg-no-repeat md:col-span-3 md:row-span-2 ">
          <h1 class="max-w-sm  text-6xl  font-normal  leading-14 tracking-tight text-white lg:text-7xl">
    Color of Summer Outfit
  </h1>

  <p class="max-w-xs text-sm text-white/90">
    100+ Collections for your outfit inspirations in this summer
  </p>

  <a href="#" class=" w-xs rounded-full bg-ink px-8   text-center py-3 text-xs font-medium tracking-wide text-white uppercase">
    View Collections
  </a>
        </div>
        <div class="image-2 p-4 rounded-4xl bg-[url('../images/image-2.png')] bg-cover bg-center bg-no-repeat ">
           <h2 class="max-w-sm  text-4xl  font-normal  leading-none tracking-tight text-ink lg:text-4xl">
  Outdoor
Active
  </h2>
        </div>
        <div
          class="image-3  p-4 rounded-4xl bg-[url('../images/image-3.png')] bg-cover bg-center bg-no-repeat ">
            <h2 class="max-w-sm  text-4xl  font-normal  leading-none tracking-tight text-ink lg:text-4xl">
  Outdoor
Active
  </h2>
        </div>
      </div>
    </div>
  </section>
  <!-- Hero Section -->

</body>

</html>
